[project]
name = "rlsignal"
version = "0.1.0"
description = "Learning-signal detection and Stage-II training-budget calibration for RL reward functions"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "pyyaml", "gymnasium"]

[project.optional-dependencies]
sb3 = ["stable-baselines3", "torch"]
crowdnav = ["matplotlib", "cython", "cmake"]   # plus Python-RVO2 built from source, see README
dev = ["pytest"]

[project.scripts]
rlsignal = "rlsignal.cli:main"

[tool.setuptools.packages.find]
include = ["rlsignal*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["CrowdNav", "results", "legacy_results", "experiments/pilot_v2_reanalysis"]

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "SIM", "PLE", "PLW"]
# SIM300 misreads single-letter uppercase math names (S, C, T) as constants ("Yoda conditions").
ignore = ["E501", "SIM108", "UP007", "B905", "SIM300"]

[tool.pytest.ini_options]
testpaths = ["tests"]
